# Proxy inverso Nginx para PGR Compras Públicas
# Instalación:
#   sudo cp deploy/nginx-pgr.conf /etc/nginx/sites-available/pgr
#   sudo ln -s /etc/nginx/sites-available/pgr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d compras.pgr.gob.sv

server {
    listen 80;
    server_name compras.pgr.gob.sv;   # cambiar por el dominio o IP del servidor

    # Límite acorde al backend (express.json limit 10mb)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3621;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # sincronización IMAP y llamadas a Gemini pueden tardar
    }
}
